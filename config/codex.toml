# 示例：根据本机修改 Node 和仓库的绝对路径。
[mcp_servers.infection_free_zone]
command = 'C:\nodejs\node.exe'
args = ['C:\path\to\InfectionFreeZone-MCP\server.mjs', '--steam', '--workforce-only', '--allow-construction']
startup_timeout_sec = 10
tool_timeout_sec = 15

[mcp_servers.ifz_runtime]
command = 'C:\nodejs\node.exe'
args = ['C:\path\to\InfectionFreeZone-MCP\runtime\runtime-mcp.mjs']
startup_timeout_sec = 10
tool_timeout_sec = 15
